version: '3.8'

services:
  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arlo-meeting-assistant-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEMO_MODE: "true"
      # Container-network address; overrides a localhost FRONTEND_URL in .env (that's for `npm run dev`).
      FRONTEND_URL: http://frontend:3000
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./storage:/app/storage
    command: npm run dev

  # Frontend (Zoom App)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arlo-meeting-assistant-frontend
    restart: unless-stopped
    # Vite dev server. The app calls the API on its own origin (through the
    # backend proxy), so it needs no API/WS URL variables.
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm start
    stdin_open: true
    tty: true

  # RTMS Server (Zoom RTMS SDK)
  # NOTE: RTMS SDK requires x86_64/amd64 platform due to native dependencies
  # On Apple Silicon (M1/M2/M3), this will run in Rosetta emulation
  rtms:
    build:
      context: ./rtms
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    platform: linux/amd64
    container_name: arlo-meeting-assistant-rtms
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:3000
      # Override PORT from .env to avoid conflict with backend's PORT=3000
      PORT: 3002
      # RTMS maps ZOOM_* → ZM_RTMS_* at startup (see rtms/src/index.js); no duplicate vars needed here.
      # ZOOM_CLIENT_ID, ZOOM_CLIENT_SECRET, and ZOOM_WEBHOOK_TOKEN come from env_file (.env)
      # RTMS SDK v1.0 logging (replaces configureLogger())
      ZM_RTMS_LOG_LEVEL: info
      # Log level for PII gating
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Note: Port 3002 is NOT exposed to host — RTMS service is only accessible
    # from the Docker internal network via http://rtms:3002 (from backend)
    expose:
      - "3002"
    volumes:
      - ./rtms/src:/app/src
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started
    command: npm start
