version: 0.2

env:
  shell: bash

phases:
  build:
    commands:
      - set -euo pipefail
      - ARTIFACT_BUCKET="$(jq -r .bucket release.json)"
      - ARTIFACT_KEY="$(jq -r .key release.json)"
      - ARTIFACT_SHA256="$(jq -r .sha256 release.json)"
      - COMMIT_SHA="$(jq -r .commit release.json)"
      - '[[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid release metadata"; exit 1; }'
      - COMMAND_ID="$(aws ssm send-command --document-name "$DEPLOY_DOCUMENT_NAME" --instance-ids "$INSTANCE_ID" --parameters "ArtifactBucket=${ARTIFACT_BUCKET},ArtifactKey=${ARTIFACT_KEY},ArtifactSha256=${ARTIFACT_SHA256},SourceCommit=${COMMIT_SHA}" --comment "Deploy Arlo ${COMMIT_SHA}" --query Command.CommandId --output text)"
      - |
        for attempt in $(seq 1 240); do
          STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
          case "$STATUS" in
            Success) break ;;
            Failed|Cancelled|TimedOut|Cancelling) echo "Deployment failed with status $STATUS"; exit 1 ;;
          esac
          if [[ "$attempt" == 240 ]]; then echo "Deployment did not finish within 20 minutes"; exit 1; fi
          sleep 5
        done
      - aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output json
      - STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text)"
      - '[[ "$STATUS" == "Success" ]] || { echo "Deployment failed with status $STATUS"; exit 1; }'
      - aws ssm put-parameter --name "$DEPLOYED_COMMIT_PARAMETER" --type String --value "$COMMIT_SHA" --overwrite >/dev/null
      - aws ec2 create-tags --resources "$INSTANCE_ID" --tags "Key=SourceCommit,Value=${COMMIT_SHA}" "Key=SourceBranch,Value=${GITHUB_BRANCH}"
